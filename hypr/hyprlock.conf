background {
    monitor =
    path = screenshot   # Toma una captura de pantalla y le aplica blur
    blur_passes = 3
    blur_size = 8
}

# Reloj
label {
    monitor =
    text = $TIME
    color = rgba(205, 214, 244, 1.0)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# Caja de contraseña
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.6
    fade_on_empty = false
    outer_color = rgb(137, 180, 250)
    inner_color = rgb(30, 30, 46)
    font_color = rgb(205, 214, 244)
    position = 0, -20
    halign = center
    valign = center
}
