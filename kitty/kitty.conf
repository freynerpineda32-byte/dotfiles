# ==========================================
# CONFIGURACIÓN DE KITTY (Personalizada)
# ==========================================

# Fuente (puedes cambiar 'JetBrainsMono Nerd Font' por la que tengas instalada)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Transparencia y Fondo (Efecto translúcido sutil estilo Hyprland)
background_opacity 0.40
dynamic_background_opacity yes

# Cursor
cursor_shape beam
cursor_blink_interval 0.5

# Ventana y Márgenes
window_padding_width 10
hide_window_decorations yes

# Comportamiento
enable_audio_bell no
remember_window_size  yes
initial_window_width  640
initial_window_height 400

# ==========================================
# PALETA DE COLORES (Tema Oscuro Minimalista)
# ==========================================
background #1e1e2e
foreground #cdd6f4

# Negro / Gris
color0 #45475a
color8 #585b70

# Rojo
color1 #f38ba8
color9 #f38ba8

# Verde
color2  #a6e3a1
color10 #a6e3a1

# Amarillo
color3  #f9e2af
color11 #f9e2af

# Azul
color4  #89b4fa
color12 #89b4fa

# Magenta / Morado
color5  #f5c2e7
color13 #f5c2e7

# Cian
color6  #94e2d5
color14 #94e2d5

# Blanco
color7  #bac2de
color15 #a6adc8
